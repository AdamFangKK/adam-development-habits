interface:
  display_name: "Adam's Development Habits"
  short_description: "Build resilient code with clear boundaries and retired stale paths."
  default_prompt: "Use $adam-development-habits to deliver a risk-scaled, reviewable change with automatic retirement. Before implementation reuse an existing owner when its contract fits; before final verification/commit automatically sweep obsolete, duplicate, dynamic, and compatibility paths, synchronize docs/comments/version metadata, and record evidence for remove/retain/unknown decisions, safeguards, delivery planning, and verification."

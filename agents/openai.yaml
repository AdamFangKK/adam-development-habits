interface:
  display_name: "Adam's Development Habits"
  short_description: "Build resilient code with clear boundaries and retire stale paths, comments, docs, and metadata."
  default_prompt: "Use $adam-development-habits to deliver a risk-scaled, reviewable change with automatic retirement and evidence-oriented instrumentation. Before implementation reuse an existing owner when its contract fits; before final verification/commit automatically sweep obsolete, duplicate, dynamic, and compatibility paths, plus stale comments, README/API text, version notes, and metadata; synchronize docs/comments/version metadata; add only applicable low-cardinality redacted probes at decision and failure boundaries; and record evidence for remove/retain/unknown decisions, instrumentation, safeguards, delivery planning, and verification."

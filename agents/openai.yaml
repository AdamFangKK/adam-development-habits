interface:
  display_name: "Adam's Development Habits"
  short_description: "Build resilient code with clear boundaries and retire stale paths, comments, docs, and metadata."
  default_prompt: "Use $adam-development-habits for risk-scaled changes with automatic retirement. For Level 1/2 bugs, regressions, incidents, or cross-boundary diagnoses, observe before editing: separate symptom/invariant, map path, list observable/blind nodes, record primary/alternative hypotheses, run a discriminating probe, locate earliest owner, apply minimal counterfactual, run regression and deployment/runtime verification, record residual risk. Keep a failed-attempt ledger with actual results/categories; do not repeat a category without new evidence and keep unknowns explicit. Before implementation reuse an existing owner with local fully-qualified module.symbol + invariant; sweep obsolete/duplicate/dynamic/compat paths and stale docs/metadata; remove unconsumed wrappers; retain named consumers with expiry/observability/coverage; trace source -> control -> sink for sensitive paths; use framework-native controls + allowed/rejected tests; record redacted probes, cleanup, safeguards, delivery, verification evidence."

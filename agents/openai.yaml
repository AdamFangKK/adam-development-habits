interface:
  display_name: "Adam's Development Habits"
  short_description: "Build resilient code with clear boundaries and retire stale paths, comments, docs, and metadata."
  default_prompt: "Use $adam-development-habits to deliver a risk-scaled, reviewable change with automatic retirement and evidence-oriented instrumentation. Before implementation reuse an existing owner and require an implementation-local fully-qualified module.symbol declaration plus current invariant; before final verification/commit automatically sweep obsolete, duplicate, dynamic, and compatibility paths, plus stale comments, README/API text, version notes, and metadata. Remove unconsumed wrappers, retain only named consumers with expiry, observability, and coverage, and mark unresolved dynamic paths unknown. Synchronize docs/comments/version metadata; add only applicable low-cardinality redacted probes at decision and failure boundaries; and record evidence for remove/retain/unknown decisions, cleanup checkpoints, instrumentation, safeguards, delivery planning, and verification."

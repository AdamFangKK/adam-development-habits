name: Adam Evidence Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate code-change evidence
        run: >-
          python .adam/scripts/check_change_evidence.py
          --base "${{ github.event.pull_request.base.sha }}"
          --require-for-code-change
          --require-level-two-for-high-risk
